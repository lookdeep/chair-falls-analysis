[project]
name = "ld-chair-falls"
version = "1.0.54"
description = "Local-first data preparation pipeline for chair-falls risk analysis"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "db-dtypes>=1.5.0",
  "google-cloud-bigquery>=3.34.0",
  "matplotlib>=3.10.8",
  "numpy>=2.4.2",
  "pandas>=2.3.0",
  "pillow>=12.1.1",
  "pyarrow>=22.0.0",
  "pydantic>=2.11.0",
  "pydantic-settings>=2.10.0",
  "python-dotenv>=1.1.0",
  "pyyaml>=6.0.2",
  "statsmodels>=0.14.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4.0",
  "ruff>=0.13.0",
]
gemini = [
  "google-genai>=1.0.0",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ld_chair_falls"]

[tool.pytest.ini_options]
markers = [
  "smoke: quick smoke tests for wiring and configuration",
  "real_benchmark: replay the frozen real-data benchmark fixture locally",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.vulture]
paths = ["src", "scripts", "tests", "vulture_whitelist.py"]
